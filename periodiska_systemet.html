function elementExample(e){

 if(e.mass===null)return 'Det finns ingen standardatomvikt angiven för '+e.name.toLowerCase()+'. En isotop kan ändå beskrivas med sitt eget masstal.';

}

const quiz={level:'Grund',order:[],at:0,choices:[],hints:[],round:0,finished:false};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(level){
 const topics=[...new Set(questions.filter(q=>q.level===level).map(q=>q.topic))];
 quiz.level=level;quiz.order=shuffle(topics).map(t=>shuffle(questions.map((q,i)=>i).filter(i=>questions[i].level===level&&questions[i].topic===t))[0]);quiz.at=0;quiz.choices=[];quiz.hints=[];quiz.finished=false;quiz.round++;quizView();
}
function quizView(){
 if(!quiz.order.length){startQuiz(quiz.level);return}
 const pos=quiz.at,total=quiz.order.length,answered=quiz.choices[pos]!==undefined,q=questions[quiz.order[pos]];
 const controls='<div class="controls"><span class="label">Nivå</span>'+['Grund','Fördjupning'].map(l=>'<button class="chip '+(l===quiz.level?'active':'')+'" aria-pressed="'+(l===quiz.level)+'" data-level="'+l+'">'+l+'</button>').join('')+'</div>';
 if(quiz.finished){
 let correct=0,helped=0;const review=quiz.order.map((id,k)=>{let ok=quiz.choices[k]===questions[id].correct;if(ok){correct++;if(quiz.hints[k])helped++}return '<li>'+questions[id].topic+' · '+(ok?(quiz.hints[k]?'rätt efter ledtråd':'rätt'):'öva vidare')+'</li>'});
 $('other').innerHTML='<div class="activity exercise">'+controls+'<h2>Din omgång</h2><p>'+correct+' av '+total+' rätt. '+helped+' rätta svar kom efter en ledtråd.</p><ul>'+review.join('')+'</ul><button class="btn primary" data-new>Ny omgång</button></div>';return;
 }
 $('other').innerHTML='<div class="activity exercise">'+controls+'<div class="qmeta"><span class="micro">'+q.topic+'</span><span class="micro">Fråga '+(pos+1)+' av '+total+'</span></div><div class="progress"><span style="width:'+(pos/total*100)+'%"></span></div><h2>'+q.q+'</h2><div class="answers">'+q.options.map((o,k)=>'<button class="answer '+(answered?(k===q.correct?'correct':k===quiz.choices[pos]?'wrong':''):'')+'" data-answer="'+k+'" '+(answered?'disabled':'')+'><b>'+['A','B','C'][k]+'</b>'+o+'</button>').join('')+'</div>'+(answered?'<div class="feedback" role="status"><strong>'+(quiz.choices[pos]===q.correct?'Rätt. ':'Rätt svar är '+['A','B','C'][q.correct]+'. ')+'</strong>'+q.explanation+'</div><div class="controls"><button class="btn primary" data-next>'+(pos===total-1?'Visa resultat':'Nästa fråga')+'</button></div>':quiz.hints[pos]?'<p class="observation" role="status">'+q.hint+'</p>':'<button class="textbtn" data-hint>Visa ledtråd</button>')+'</div>';
}
function answerQuiz(k){
 if(quiz.choices[quiz.at]!==undefined)return;quiz.choices[quiz.at]=k;const q=questions[quiz.order[quiz.at]];
 if(q.correct!==k){const alternative=questions.findIndex((x,i)=>x.topic===q.topic&&x.level===q.level&&!quiz.order.includes(i));if(alternative>=0)quiz.order.splice(quiz.at+1,0,alternative)}

}

function showSources(){
 openDialog('Källor och modeller','<div class="dialogcopy"><h3>Så läser du tabellen</h3><p>Varje ruta står för ett grundämne. Atomnumret är antalet protoner i kärnan. De vågräta raderna kallas perioder, de lodräta kolumnerna grupper. Ämnen i samma huvudgrupp har ofta liknande kemiska egenskaper. Väte står i grupp 1 och är en icke-metall. Heliums första skal är fullt med två elektroner.</p><h3>Atomvikt och masstal</h3><p>Standardatomvikten är en relativ, enhetslös storhet som speglar isotopernas massor och förekomst i vanliga jordiska material. Tabellen visar CIAAW:s förkortade värden. Masstalet gäller en bestämd isotop och är summan av antalet protoner och neutroner. I atommodellen kan du byta mellan utvalda isotoper.</p><h3>Vad färgerna visar</h3><p>Ämnesfamiljerna är en undervisningsindelning. Gränserna för halvmetaller kan variera. Här ligger grupp 12 bland övriga metaller. För tenness och oganesson anger familjen platsen i tabellen. De två utdragna serierna tillhör period 6 och 7.</p><p>Aggregationsformen gäller det rena ämnet vid 20 °C och ungefär normalt lufttryck. För flera mycket sällsynta eller kortlivade ämnen saknas tillräckliga mätdata. De har markerats som osäkra.</p><h3>Atommodellen</h3><p>Skalen visar antalet elektroner på varje huvudnivå. För joner erbjuds ett urval vanliga laddningar hos lätta ämnen. Jämför exempelvis natrium med natriumjonen. Skaldata visas för atomnummer 1 till 103. För vissa av de tyngre ämnena bygger fördelningen på beräkningar.</p><h3>Faktakällor</h3><ul><li><a href="https://ciaaw.org/abridged-atomic-weights.htm">CIAAW · förkortade standardatomvikter</a> och <a href="https://ciaaw.org/isotopic-abundances.htm">isotopsammansättning</a></li><li><a href="https://kemisamfundet.se/wp-content/uploads/2020/05/Skrivregler-S%C3%A4rtryck-Kemisk-Tidskrift.pdf">Svenska Kemisamfundet · svenska grundämnesnamn</a></li><li><a href="https://math.nist.gov/DFTdata/atomdata/configuration.html">NIST · elektronkonfigurationer</a> och <a href="https://pubchem.ncbi.nlm.nih.gov/periodic-table/">PubChem · egenskaper och kompletterande data</a></li><li><a href="https://periodic-table.rsc.org/">Royal Society of Chemistry · egenskaper, historia och användning</a>. Varje ämneskort länkar till sin faktasida.</li></ul><h3>Undervisning i kemi, årskurs 7 till 9</h3><p>Uppdragen knyter an till grundämnen, joner, molekyler, partikelmodeller och modellernas historiska framväxt. Jämförelserna ger eleverna tillfälle att förutsäga, söka belägg och förklara ett resultat.</p><ul><li><a href="https://www.skolverket.se/undervisning/grundskolan/kursplaner-for-grundskolan/subjects/GRGRKEM01">Skolverket · kursplan i kemi</a></li><li><a href="https://www.skolverket.se/download/18.1cf74b4f183ff5ed375d77/1668517948917/pdf9872.pdf">Skolverket · kommentarmaterial till kursplanen</a></li></ul></div>');
 $('dialogBody').querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});
}
function addDialogLink(params,printable=false){
 const url=new URL(location.href);url.hash=new URLSearchParams(params).toString();
 const row=document.createElement('div');row.className='controls dialog-actions';
 if(printable){const btn=document.createElement('button');btn.className='btn';btn.textContent='Skriv ut uppdrag';btn.onclick=()=>window.print();row.append(btn)}
 if(url.protocol==='https:'||url.protocol==='http:'){
  const link=document.createElement('a');link.href=url.href;link.className='textbtn';link.textContent='Direktlänk';link.title='Kopiera länkadressen för att dela denna vy';row.append(link);
  const btn=document.createElement('button');btn.className='btn';btn.textContent='Kopiera länk';btn.onclick=async()=>{try{await navigator.clipboard.writeText(url.href);btn.textContent='Länken kopierad'}catch{link.textContent=url.href;link.focus()}};row.append(btn)
 }
 $('dialogBody').append(row);
}
function syncUrl(){
 const p=new URLSearchParams();p.set('vy',state.mode);if(state.mode==='explore'){p.set('z',state.z);if(state.color!=='category')p.set('farg',state.color)}if(state.mode==='compare'){p.set('a',state.a);p.set('b',state.b)}
 try{history.replaceState(null,'','#'+p)}catch{}
}
function boardView(){
 $('board').innerHTML=icon('board')+(state.board?'Avsluta tavelläge':'Tavelläge');$('board').setAttribute('aria-pressed',state.board);document.body.classList.toggle('projecting',state.board);
}
function setMode(name,scroll=false){
 state.mode=name;$('heading').textContent=modes[name][2];$('intro').textContent=modes[name][3];
 document.querySelector('.hero').classList.toggle('other-hero',name!=='explore');
 $('explore').hidden=name!=='explore';$('other').hidden=name==='explore';
 $('nav').innerHTML=Object.entries(modes).map(([key,[label,ic]])=>'<button class="navbtn" data-mode="'+key+'" '+(name===key?'aria-current="page"':'')+'>'+icon(ic)+label+'</button>').join('');
 if(name==='explore'){refreshGrid();inspect()}else if(name==='compare')compareView();else if(name==='quiz')quizView();else lessonList();
 syncUrl();if(scroll)window.scrollTo({top:0,behavior:'instant'});
}
$('other').onclick=ev=>{
 const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.pair){[state.a,state.b]=b.dataset.pair.split(',').map(Number);compareView();syncUrl();$('other').querySelector('[data-pair="'+b.dataset.pair+'"]').focus({preventScroll:true})}
 else if(b.dataset.model)workshop(+b.dataset.model);
 else if(b.hasAttribute('data-lesson'))lessonDialog(+b.dataset.lesson);
 else if(b.dataset.level&&b.dataset.level!==quiz.level)startQuiz(b.dataset.level);
 else if(b.hasAttribute('data-new'))startQuiz(quiz.level);
 else if(b.hasAttribute('data-hint')){quiz.hints[quiz.at]=true;quizView();$('other').querySelector('[data-answer]').focus()}
 else if(b.hasAttribute('data-answer'))answerQuiz(+b.dataset.answer);
 else if(b.hasAttribute('data-next')){if(quiz.at+1>=quiz.order.length)quiz.finished=true;else quiz.at++;quizView();$('other').querySelector('.answer,[data-new]')?.focus()}
};
$('dialogBody').onclick=ev=>{let b=ev.target.closest('[data-jump]');if(!b)return;const i=state.lesson;$('dialog').close();clearFilters();state.z=+b.dataset.jump;setMode('explore',true);$('returnLesson').hidden=false;$('returnLesson').textContent='Till uppdraget · '+lessons[i].title};
$('returnLesson').onclick=()=>{setMode('lessons',true);lessonDialog(state.lesson);$('returnLesson').hidden=true};
$('nav').onclick=ev=>{const b=ev.target.closest('[data-mode]');if(b){$('returnLesson').hidden=true;setMode(b.dataset.mode,true);$('nav').querySelector('[data-mode="'+b.dataset.mode+'"]').focus({preventScroll:true})}};
$('board').onclick=async()=>{
 state.board=!state.board;if(state.board){setMode('explore',true);try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen?.()}catch{}}
 else if(document.fullscreenElement){try{await document.exitFullscreen()}catch{}}
 boardView();
};
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&state.board){state.board=false;boardView()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.board&&!$('dialog').open&&!document.fullscreenElement){state.board=false;boardView()}});
$('sources').onclick=showSources;$('print').onclick=()=>window.print();
function restore(){
 const p=new URLSearchParams(location.hash.slice(1));for(const k of ['z','a','b']){const n=Number(p.get(k));if(Number.isInteger(n)&&n>=1&&n<=118)state[k]=n}
 if(['category','phase','plain','period'].includes(p.get('farg')))state.color=p.get('farg');
 $('color').value=state.color;boardView();setMode(Object.hasOwn(modes,p.get('vy'))?p.get('vy'):'explore');
 if(state.mode==='explore'&&p.get('atom')==='1')workshop(state.z);
 const lesson=Number(p.get('uppdrag'));if(state.mode==='lessons'&&Number.isInteger(lesson)&&lesson>=1&&lesson<=lessons.length)lessonDialog(lesson-1);
}
restore();window.addEventListener('hashchange',restore);
</script></body></html>
