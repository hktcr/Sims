            if(normal[2]<-.04)continue;
            const pts=face.corners.map(v=>screen(transform(v),scale));
            const light=clamp(dot(normal,[-.36,.50,.79]),-1,1);
            const base=face.positive?'#4c9380':'#cd914a';
            const fill=light>0?blend(base,255,.30*light):blend(base,0,-.27*light);
            const poly=pts.map(v=>number(v[0])+','+number(v[1])).join(' ');

          }
        }
      }else if(kind==='dalton'){items.push({z:0,s:ball(middle,scale*.83,'#648e78','','',ink,1.6)})}

        const isBohr=kind==='bohr', isThomson=kind==='thomson';
        if(isBohr&&!scene.shells){message('Skalfördelning saknas i underlaget.')}

                // A projected equator helps distinguish a spherical energy level
                // from a flat orbit. The surrounding circle is its silhouette.
                const pts=[];
                for(let i=0;i<=64;i++){
                  const a=tau*i/64,p=turn([radius*Math.cos(a),0,radius*Math.sin(a)],yaw+.3,pitch+.34);

                }

            }
          }else if(isThomson){
            back.push(ring(middle,scale*.94,'fill="#f0d4ad" fill-opacity=".83" stroke="#ab7f4b" stroke-width="1.6"'));

  }

const quiz={level:'Grund',order:[],at:0,choices:[],hints:[],round:0,finished:false};
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(level){
 const topics=[...new Set(questions.filter(q=>q.level===level).map(q=>q.topic))];

}
function quizView(){
 if(!quiz.order.length){startQuiz(quiz.level);return}

 }

ps://math.nist.gov/DFTdata/atomdata/configuration.html">NIST · elektronkonfigurationer</a> och <a href="https://pubchem.ncbi.nlm.nih.gov/periodic-table/">PubChem · egenskaper och kompletterande data</a></li><li><a href="https://periodic-table.rsc.org/">Royal Society of Chemistry · egenskaper, historia och användning</a>. Varje ämneskort länkar till sin faktasida.</li></ul><h3>Undervisning i kemi, årskurs 7 till 9</h3><p>Uppdragen knyter an till grundämnen, joner, molekyler, partikelmodeller och modellernas historiska framväxt. Jämförelserna ger eleverna tillfälle att förutsäga, söka belägg och förklara ett resultat.</p><ul><li><a href="https://www.skolverket.se/undervisning/grundskolan/kursplaner-for-grundskolan/subjects/GRGRKEM01">Skolverket · kursplan i kemi</a></li><li><a href="https://www.skolverket.se/download/18.1cf74b4f183ff5ed375d77/1668517948917/pdf9872.pdf">Skolverket · kommentarmaterial till kursplanen</a></li></ul></div>');

    $('labSide').innerHTML='<div class="lab-id"><span class="notation"><sup>'+(v.mass??'')+'</sup>'+e.symbol+'<sup>'+qStr(v.charge)+'</sup></span><span>'+e.name+'</span></div><label>Atommodell<select id="layer">'+history.map(m=>opt(m.id,m.id==='bohr'?'Bohrs skalmodell':m.title,v.layer)).join('')+'</select></label>'+
      (isotopes[v.z]?'<label>Isotop<select id="isotope">'+isotopes[v.z].map(a=>opt(a,e.name+'-'+a,v.mass)).join('')+'</select></label>':'')+
      (charges[v.z]?'<label>Atom eller jon<select id="charge">'+charges[v.z].map(q=>opt(q,chargeLabel(q),v.charge)).join('')+'</select></label>':'')+
      (v.layer==='quantum'&&subs.length?'<label>Visa formexempel ur underskal<select id="orbital">'+subs.map(s=>opt(s,s,v.orbital)).join('')+'</select></label>':'')+
      '<div class="particle-strip"><div><b>'+v.z+'</b>protoner</div><div><b>'+(v.mass?v.mass-v.z:'?')+'</b>neutroner</div><div><b>'+(v.z-v.charge)+'</b>elektroner</div></div>'+
      '<p class="model-desc">'+(v.mass?'Masstalet är '+v.mass+'. ':'Välj ett grundämne med isotopurval för att se antalet neutroner. ')+(v.charge?'Partikelräkningen gäller jonen med laddning '+(v.charge>0?'+':'−')+Math.abs(v.charge)+'.':'Atomen är neutral.')+'</p>';
    const brief={
      bohr:'Ringarna visar huvudskalen. Prickarna gör elektronerna lätta att räkna. Deras lägen och avstånden är schematiska.',
      dalton:'Klotet visar ett atomslag i Daltons modell. Atomens inre delar och skillnaden mellan isotoper blev kända senare.',
      thomson:'Modellen placerar elektroner i en utbredd positiv laddning. Den innehåller ingen särskild atomkärna.',
      rutherford:'Den lilla kärnan och det stora utrymmet omkring den står i centrum. Elektronernas lägen är illustrativa.',
      quantum:'Bilden visar vinkelformen för en representativ orbital i valt underskal. Färger på olika lober anger vågfunktionens tecken. Storlek, radiella noder och elektrontäthet återges inte kvantitativt.'
    }[v.layer];
    const dataNote=v.z===103?' För lawrencium visas den teoretiska tilldelningen 7p¹, som får indirekt stöd av den uppmätta första jonisationsenergin.':'';
    $('labBelow').innerHTML='<p class="lab-note">'+(canDraw?brief:zero?'Jonen har ingen elektron vars orbitalform kan visas.':'Det finns inga verifierade skal- eller orbitaldata för denna vy.')+dataNote+'</p>'+electronPanel(config,shells)+historyPanel(h);
    $('layer').onchange=e=>{v.layer=e.target.value;refresh('layer')};
    if($('isotope')) $('isotope').onchange=e=>{v.mass=Number(e.target.value);refresh('isotope')};
    if($('charge')) $('charge').onchange=e=>{v.charge=Number(e.target.value);refresh('charge')};
    if($('orbital')) $('orbital').onchange=e=>{v.orbital=e.target.value;refresh('orbital')};
  }
  function speciesContent() {
    const item=species[current.id];
    scene=LabScene.substance(item,{label:item.name});
    $('labCaption').textContent=item.type;
    $('labSide').innerHTML='<div class="lab-formula">'+item.formula+'</div><label>Välj partikel eller material<select id="speciesChoice">'+Object.entries(species).map(([id,s])=>opt(id,s.name,current.id)).join('')+'</select></label><p>'+item.description+'</p>';
    $('labBelow').innerHTML='<div class="lab-section"><h3>Att läsa modellen</h3><p>'+(item.note||'Kulorna markerar atomernas lägen. Strecken visar bindningar mellan atomer. Färger och storlekar är valda för att olika atomslag ska gå att skilja åt.')+'</p><p class="model-desc">'+source(item.source,item.url)+'</p></div>';
    $('speciesChoice').onchange=e=>{if(e.target.value==='Cl'){openAtom(17,null,-1,new URLSearchParams({dim:current.dimension}));return}current.id=e.target.value;$('dialogTitle').textContent=species[current.id].name;current.camera={...initialCamera};refresh('speciesChoice')};
  }
  function processContent() {
    const v=current, item=processes.find(p=>p.id===v.id), step=item.steps[v.step];
    const frame=item.steps.flatMap(s=>[...(s.atoms||[]),...(s.tags||[])]);
    scene=step.atomScene?LabScene.atom(step.atomScene):LabScene.substance(step,{frame,label:step.title});
    $('labCaption').textContent='Steg '+(v.step+1)+' av '+item.steps.length;
    const energy=step.atomScene?'<div class="energy-diagram" aria-label="Energinivåer">'+[3,2,1].map(n=>'<div><small>n = '+n+'</small><i></i><b>'+(step.atomScene.shells[n-1]?'●':'')+'</b></div>').join('')+'</div>':'';
    $('labSide').innerHTML='<label>Förberedd process<select id="processChoice">'+processes.map(s=>opt(s.id,s.name,v.id)).join('')+'</select></label><h3>'+step.title+'</h3><p aria-live="polite">'+step.text+'</p>'+energy+'<div class="step-buttons"><button class="btn" id="previousStep" '+(v.step===0?'disabled':'')+'>Föregående</button><button class="btn primary" id="nextStep" '+(v.step===item.steps.length-1?'disabled':'')+'>Nästa steg</button></div><button class="textbtn" id="playProcess">'+(timer?'Pausa':'Spela stegen')+'</button>';
    $('labBelow').innerHTML='<section class="lab-section"><h3>Processens steg</h3><div class="step-track">'+item.steps.map((s,i)=>'<button data-step-index="'+i+'" aria-pressed="'+(i===v.step)+'"><span>'+(i+1)+'</span>'+s.title+'</button>').join('')+'</div><p>'+item.description+'</p><p class="model-desc">'+source(item.source,item.url)+'</p></section>';
    $('processChoice').onchange=e=>{const id=e.target.value;stop();v.id=id;v.step=0;v.camera={...initialCamera};$('dialogTitle').textContent=processes.find(p=>p.id===id).name;refresh('processChoice')};
    $('previousStep').onclick=()=>{stop();v.step--;refresh('previousStep')};
    $('nextStep').onclick=()=>{stop();v.step++;refresh('nextStep')};
    $('playProcess').onclick=()=>{
      if (timer) {stop();return}
      if (v.step===item.steps.length-1) v.step=0;
      timer=setInterval(()=>{if (!current||!$('dialog').open){stop();return}v.step++;if(v.step>=item.steps.length-1)stop();refresh()},4500);
      refresh('playProcess');
    };
  }

  function renderFigure() {
    if(!current)return;
    $('viewport').innerHTML=scene?LabScene.render(scene,{dimension:current.dimension,...current.camera}):'<p class="empty-scene">Ingen elektronmodell för detta urval.</p>';
  }
  function cameraToolbar() {
    const spatial=current.dimension==='3d';
    document.querySelectorAll('[data-dim]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.dim===current.dimension)));
    document.querySelectorAll('[data-move]').forEach(b=>{
      b.hidden=!spatial&&['left','right','up','down'].includes(b.dataset.move);
      b.disabled=!scene;
    });
    $('viewport').classList.toggle('rotatable',spatial&&!!scene);
    $('gesture').textContent=spatial?'Dra för att vrida eller använd piltangenterna.':'Plan vy';
  }
  function refresh(focusId) {
    if(current.kind==='atom')atomContent();
    else if(current.kind==='species')speciesContent();
    else processContent();
    cameraToolbar();
    renderFigure();
    shareCurrent();
    if(focusId)$(focusId)?.focus({preventScroll:true});
  }
  function move(direction) {
    const cam=current.camera, pitchLimit=Math.PI/2-.02;
    if(direction==='reset')current.camera={...initialCamera};
    if(direction==='in')cam.zoom=Math.min(1.65,cam.zoom+.12);
    if(direction==='out')cam.zoom=Math.max(.6,cam.zoom-.12);
    if(current.dimension==='3d'){
      if(direction==='left')cam.yaw-=.22;
      if(direction==='right')cam.yaw+=.22;
      if(direction==='up')cam.pitch=Math.min(pitchLimit,cam.pitch+.16);
      if(direction==='down')cam.pitch=Math.max(-pitchLimit,cam.pitch-.16);
    }
    renderFigure();
  }
  function bindCamera(){
    const viewport=$('viewport');
    const keyDirections={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down','+':'in','=':'in','-':'out',Home:'reset'};
    viewport.onkeydown=e=>{if(keyDirections[e.key]){e.preventDefault();move(keyDirections[e.key])}};
    viewport.onpointerdown=e=>{
      if(current.dimension!=='3d'||!scene||e.button!==0)return;
      drag={id:e.pointerId,x:e.clientX,y:e.clientY};
      viewport.setPointerCapture(e.pointerId);
    };
    viewport.onpointermove=e=>{
      if(!drag||drag.id!==e.pointerId||!current)return;
      current.camera.yaw+=(e.clientX-drag.x)*.012;
      current.camera.pitch=Math.max(-1.55,Math.min(1.55,current.camera.pitch+(drag.y-e.clientY)*.012));
      drag.x=e.clientX;drag.y=e.clientY;renderFigure();
    };
    viewport.onlostpointercapture=viewport.onpointercancel=viewport.onpointerup=()=>{drag=null};
    $('camera').onclick=e=>{const b=e.target.closest('[data-move]');if(b)move(b.dataset.move)};
    const bar=$('viewport').previousElementSibling;
    bar.onclick=e=>{const b=e.target.closest('[data-dim]');if(!b)return;current.dimension=b.dataset.dim;cameraToolbar();renderFigure();shareCurrent()};
    $('labBelow').onclick=e=>{
      const b=e.target.closest('button');if(!b)return;
      if(b.dataset.era){current.layer=b.dataset.era;refresh();$('labBelow').querySelector('[data-era="'+b.dataset.era+'"]').focus({preventScroll:true})}
      else if(b.dataset.display){current.display=b.dataset.display;refresh();$('labBelow').querySelector('[data-display="'+b.dataset.display+'"]').focus({preventScroll:true})}
      else if(b.hasAttribute('data-step-index')){stop();current.step=Number(b.dataset.stepIndex);refresh();$('labBelow').querySelector('[data-step-index="'+current.step+'"]').focus({preventScroll:true})}
    };
  }
  function related(symbol){
    const parts=Object.entries(species).filter(([,item])=>item.atoms.some(a=>a[0]===symbol));
    const actions=processes.filter(p=>p.steps.some(s=>s.atomScene?.symbol===symbol||s.atoms?.some(a=>a[0]===symbol)));
    if(!parts.length&&!actions.length)return '';
    return '<details class="related-lab"><summary>Relaterade modeller och processer</summary><div>'+
      parts.map(([id,item])=>'<button class="chip" data-species="'+id+'">'+item.name+' · '+item.formula+'</button>').join('')+
      actions.map(item=>'<button class="chip" data-process="'+item.id+'">'+item.name+'</button>').join('')+'</div></details>';
  }
  function relatedClick(b){
    if(b.dataset.species){openSpecies(b.dataset.species);return true}
    if(b.dataset.process){openProcess(b.dataset.process);return true}
    return false;
  }
  function gallery(){
    const cards=Object.entries(species).map(([id,item])=>{
      const scene=LabScene.substance(item,{label:item.name});
      const art=LabScene.render(scene,{dimension:'3d',...initialCamera});
      return '<button class="specimen" data-species="'+id+'"><span class="specimen-art" aria-hidden="true">'+art+'</span><span class="specimen-text"><span class="label">'+item.type+'</span><b>'+item.name+'</b><small>'+item.formula+'</small></span></button>';
    }).join('');
    $('other').innerHTML='<div class="studio-lead"><div><span class="label">Atomer och joner</span><h2>Hur är atomen byggd?</h2><p>Börja med Bohrs skalmodell. Byt sedan historiskt lager eller undersök hur elektroner fördelas mellan orbitaler.</p></div><div class="studio-picker"><label for="galleryElement">Välj grundämne</label><div><select id="galleryElement">'+selectOptions(state.z)+'</select><button class="btn primary" data-open-atom>Öppna modell</button></div></div></div>'+
    '<section class="gallery-section"><h2>Molekyler, joner och kristaller</h2><div class="specimen-grid">'+cards+'</div></section>'+
    '<section class="gallery-section"><h2>Förberedda processer</h2><div class="process-grid">'+processes.map(item=>'<button class="process-card" data-process="'+item.id+'"><span class="label">'+item.steps.length+' steg</span><strong>'+item.name+'</strong><span>'+item.description+'</span></button>').join('')+'</div></section>';
  }
  function galleryClick(b){
    if(b.hasAttribute('data-open-atom')){state.z=Number($('galleryElement').value);openAtom(state.z);return true}
    if(b.dataset.species){openSpecies(b.dataset.species);return true}
    if(b.dataset.process){openProcess(b.dataset.process);return true}
    return false;
  }
  function restoreLink(p) {
    if (p.has('partikel'))openSpecies(p.get('partikel'),p);
    else if(p.has('process'))openProcess(p.get('process'),p);
  }
  return {openAtom,openSpecies,openProcess,gallery,galleryClick,restoreLink,related,relatedClick};
})();

restore();window.addEventListener("hashchange",restore);</script></body></html>
